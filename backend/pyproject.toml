[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security checks)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (Python modern syntax)
]
ignore = [
    "E501",  # Line length advisory for scientific formulas and LaTeX strings
    "B008",  # Do not perform function call in argument defaults (standard FastAPI Depends/Query)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S102", "S105", "S106"]  # Allow assert, exec, and fixture tokens in tests
