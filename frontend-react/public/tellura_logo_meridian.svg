<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-space)" />

  <!-- Atmospheric Outer Aura -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Elliptical Orbital Velocity Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="65" transform="rotate(-28 256 256)" 
           fill="none" stroke="url(#cyan-glow)" stroke-width="4.5" stroke-dasharray="14 8 2 8" filter="url(#glow)" />

  <!-- Central Planetary Sphere Backdrop -->
  <circle cx="256" cy="256" r="100" fill="#0A1120" stroke="#1E293B" stroke-width="2" />

  <!-- Latitude Contour Arcs (Earth Science Decadal Strata) -->
  <path d="M 176 210 Q 256 240 336 210" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.7" />
  <path d="M 160 256 Q 256 292 352 256" fill="none" stroke="url(#emerald-glow)" stroke-width="3.5" filter="url(#glow)" />
  <path d="M 176 302 Q 256 332 336 302" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.7" />

  <!-- Monogram 'T' Sculpted Meridian Spine -->
  <!-- Horizontal T-bar (Northern Latitude) -->
  <path d="M 170 176 L 342 176" stroke="url(#cyan-glow)" stroke-width="9" stroke-linecap="round" filter="url(#glow)" />
  <!-- Vertical T-stem (Prime Meridian passing through core) -->
  <path d="M 256 176 L 256 336" stroke="url(#cyan-glow)" stroke-width="9" stroke-linecap="round" filter="url(#glow)" />

  <!-- Orbiting Satellite Beacon Spark -->
  <circle cx="395" cy="180" r="7" fill="url(#amber-accent)" filter="url(#glow)" />
  <circle cx="395" cy="180" r="3" fill="#FFFFFF" />

  <!-- Subtle Core Pulse Node -->
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" filter="url(#glow)" />
</svg>
