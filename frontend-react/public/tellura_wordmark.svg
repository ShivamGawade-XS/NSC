<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <radialGradient id="wm-space" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#060912" />
    </radialGradient>
    <linearGradient id="wm-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="wm-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="wm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="240" rx="32" fill="url(#wm-space)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left Icon Emblem (Scale 140x140 at x=60, y=50) -->
  <g transform="translate(60, 50)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="70" cy="70" rx="72" ry="28" transform="rotate(-28 70 70)" 
             fill="none" stroke="url(#wm-cyan-blue)" stroke-width="3" stroke-dasharray="8 5 2 5" filter="url(#wm-glow)" />

    <!-- Planetary Sphere Body -->
    <circle cx="70" cy="70" r="48" fill="#0A1120" stroke="#1E293B" stroke-width="1.5" />

    <!-- Contour Curves -->
    <path d="M 32 60 Q 70 74 108 60" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <path d="M 24 70 Q 70 85 116 70" fill="none" stroke="url(#wm-emerald)" stroke-width="2.5" filter="url(#wm-glow)" />
    <path d="M 32 80 Q 70 94 108 80" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />

    <!-- Monogram 'T' Spine -->
    <path d="M 36 38 L 104 38" stroke="url(#wm-cyan-blue)" stroke-width="5" stroke-linecap="round" filter="url(#wm-glow)" />
    <path d="M 70 38 L 70 102" stroke="url(#wm-cyan-blue)" stroke-width="5" stroke-linecap="round" filter="url(#wm-glow)" />

    <!-- Beacon Pulse -->
    <circle cx="128" cy="40" r="4" fill="#F59E0B" filter="url(#wm-glow)" />
    <circle cx="128" cy="40" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography Wordmark -->
  <!-- "tellura" Main Title in Modern Lowercase Geometric Sans -->
  <text x="235" y="128" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="78" 
        font-weight="800" 
        letter-spacing="-1.5" 
        fill="#F8FAFC">
    tellura
  </text>
  <!-- Accent Dot over 'a' or end dot -->
  <circle cx="510" cy="85" r="5" fill="#00F0FF" filter="url(#wm-glow)" />

  <!-- Subtitle Tagline -->
  <text x="240" y="165" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, monospace" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#94A3B8">
    SPATIOTEMPORAL CLIMATE WORKSTATION
  </text>

  <!-- NASA Space Apps Pill Badge -->
  <g transform="translate(680, 78)">
    <rect width="210" height="42" rx="21" fill="#0B1B3D" stroke="#1D4ED8" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#3B82F6" />
    <text x="38" y="26" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="0.8" 
          fill="#93C5FD">
      NASA SPACE APPS 2026
    </text>
  </g>
</svg>
