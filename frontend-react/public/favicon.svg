<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Deep Orbit Squircle Background for High Contrast on both Light & Dark Browser Tabs -->
  <rect width="100" height="100" rx="22" fill="#0B1120"/>
  
  <!-- Atmosphere White Upper Arc (Top-Left Planetary Limb) -->
  <path d="M 28.18 66.72 A 27.50 27.50 0 0 0 71.90 33.32" 
        stroke="#F8FAFC" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        
  <!-- Signal Blue Lower Arc (Bottom-Right Terrestrial Limb) -->
  <path d="M 75.64 40.04 A 27.50 27.50 0 0 0 24.44 60.00" 
        stroke="#2563EB" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        
  <!-- Ascending Signal Vector Line -->
  <line x1="16.82" y1="68.54" x2="84.92" y2="30.48" 
        stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
        
  <!-- Satellite Telemetry Node -->
  <circle cx="73.99" cy="36.58" r="5.0" fill="#2563EB"/>
  <circle cx="73.99" cy="36.58" r="2.2" fill="#FFFFFF"/>
</svg>
