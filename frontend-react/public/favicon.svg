<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0A0F1E"/>
  <!-- Rising trend line: bottom-left to top-right -->
  <polyline
    points="10,52 24,38 36,42 50,18"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Satellite orbit arc at the peak -->
  <ellipse
    cx="50" cy="14"
    rx="10" ry="5"
    stroke="#00E5FF"
    stroke-width="2.5"
    fill="none"
    transform="rotate(-30 50 14)"
  />
  <!-- Satellite dot -->
  <circle cx="57" cy="10" r="2" fill="#00E5FF"/>
</svg>
