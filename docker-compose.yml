version: "3.8"

services:
  earthsift:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earthsift-engine
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - MERRA2_DATA_DIR=/app/backend/data/fixtures
      - EARTHSIFT_DB_PATH=/app/cache/earthdata_cache.db
      - SECRET_KEY=${SECRET_KEY:-}
      # Optional: Add GEMINI_API_KEY or OPENAI_API_KEY for live AI explanation
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    tmpfs:
      - /tmp:size=128M,mode=1777,noexec,nosuid,nodev
      - /app/cache:size=128M,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
      - /app/backend/data:size=256M,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
