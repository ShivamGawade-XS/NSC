services:
  Tellura:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Tellura-engine
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - MERRA2_DATA_DIR=/app/backend/data/fixtures
      - TELLURA_DB_PATH=/app/cache/earthdata_cache.db
      - NASA_POWER_CACHE_DIR=/app/cache/nasa_power
      - TELLURA_INBOX_DIR=/app/cache/inbox
      - SECRET_KEY=${SECRET_KEY:-}
      # Optional external credentials (passed through if set in .env or host)
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - EARTHDATA_TOKEN=${EARTHDATA_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - CONTACT_RECIPIENT_EMAIL=${CONTACT_RECIPIENT_EMAIL:-}
    tmpfs:
      - /tmp:size=128M,mode=1777,noexec,nosuid,nodev
    volumes:
      - Tellura-cache:/app/cache
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  Tellura-cache:
    name: Tellura-cache
