name: Production CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend

      - name: Type Check with Pyright
        run: |
          npx pyright

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests -v --timeout=120

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend-react/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: npm install

      - name: Run Oxlint
        working-directory: frontend-react
        run: npm run lint

      - name: Run Vite Production Build
        working-directory: frontend-react
        run: npm run build

  container-and-trivy:
    name: Docker Build & Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Docker Image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab204004f421ee0 # v5.1.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: Tellura:latest
          load: true

      - name: Run Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name tellura-ci Tellura:latest
          sleep 5
          curl -f http://127.0.0.1:8000/api/v1/health || exit 1
          docker stop tellura-ci

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: "Tellura:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
