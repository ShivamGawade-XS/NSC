name: Production CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-timeout prometheus-client matplotlib

      - name: Lint with Ruff
        run: |
          ruff check backend

      - name: Type Check with Pyright
        run: |
          npx pyright

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests -v --timeout=120

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run Oxlint
        working-directory: frontend-react
        run: npm run lint

      - name: Run Vite Production Build
        working-directory: frontend-react
        run: npm run build

  container-and-trivy:
    name: Docker Build & Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tellura:latest
          load: true

      - name: Run Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name tellura-ci tellura:latest
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8000/api/v1/health; then
              echo "Container is healthy!"
              break
            fi
            echo "Waiting for container to initialize ($i/15)..."
            sleep 2
          done
          docker logs tellura-ci
          curl -f http://127.0.0.1:8000/api/v1/health || exit 1
          docker stop tellura-ci

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tellura:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
