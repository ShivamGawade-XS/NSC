name: DevSecOps & Security Hardening Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-security:
    name: Python SAST & CVE Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit -r backend/requirements.txt

      - name: Run Bandit AST Security Analysis
        run: |
          bandit -r backend -ll -v

      - name: Run pip-audit Dependency CVE Scanner
        run: |
          pip-audit -r backend/requirements.txt

  frontend-security:
    name: Frontend Supply-Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Run npm Audit
        working-directory: frontend-react
        run: |
          npm audit --audit-level=high

  secret-detection:
    name: Secret & Credential Leakage Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
